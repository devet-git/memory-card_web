  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="Flashcard memory and vocabulary learning web app" />
  <meta property="og:title" content="MemCard - Học từ vựng Flashcard" />
  <meta property="og:description" content="Flashcard memory and vocabulary learning web app" />
  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  <title>MemCard</title>
  <style>
    /* Splash shown while the app's JavaScript downloads; React replaces it on mount */
    html, body { margin: 0; background: #f8fafc; }
    html[data-theme="dark"], html[data-theme="dark"] body { background: #0b0f17; }
    .mc-splash { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #0f172a; }
    html[data-theme="dark"] .mc-splash { color: #f8fafc; }
    .mc-stage { position: relative; width: 148px; height: 100px; perspective: 700px; }
    .mc-ghost { position: absolute; inset: 0; border-radius: 14px; opacity: .55; animation: mc-fan 2.4s ease-in-out infinite; }
    .mc-ghost.a { background: linear-gradient(135deg, #93c5fd, #60a5fa); --dx: -10px; --dy: 6px; --rot: -7deg; }
    .mc-ghost.b { background: linear-gradient(135deg, #a78bfa, #8b5cf6); --dx: 10px; --dy: 4px; --rot: 6deg; animation-delay: .2s; }
    .mc-bob { position: absolute; inset: 0; transform-style: preserve-3d; animation: mc-bob 2.4s ease-in-out infinite; }
    .mc-flip { position: absolute; inset: 0; transform-style: preserve-3d; animation: mc-flip 2.4s cubic-bezier(.6, 0, .3, 1) infinite; }
    .mc-face { position: absolute; inset: 0; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 10px 24px rgba(59, 130, 246, .28); }
    .mc-face small { font-size: 9px; font-weight: 800; letter-spacing: .12em; opacity: .7; }
    .mc-face strong { font-size: 20px; font-weight: 800; }
    .mc-front { background: #fff; color: #0f172a; border: 2px solid #3b82f6; }
    html[data-theme="dark"] .mc-front { background: #162035; color: #f8fafc; }
    .mc-back { background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: #fff; transform: rotateY(180deg); }
    .mc-shadow { position: absolute; left: 12%; right: 12%; bottom: -18px; height: 10px; border-radius: 50%; background: #1e3a8a;
      filter: blur(6px); animation: mc-shadow 2.4s ease-in-out infinite; }
    .mc-name { font-size: 22px; font-weight: 800; letter-spacing: -.02em; margin-top: 8px;
      background: linear-gradient(135deg, #2563eb, #7c3aed); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .mc-bar { width: 160px; height: 4px; border-radius: 9999px; overflow: hidden; background: rgba(148, 163, 184, .3); }
    .mc-bar span { display: block; width: 40%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #3b82f6, #8b5cf6); animation: mc-sweep 1.3s ease-in-out infinite; }
    @keyframes mc-flip { 0%, 36% { transform: rotateY(0); } 50%, 86% { transform: rotateY(180deg); } 100% { transform: rotateY(360deg); } }
    @keyframes mc-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes mc-shadow { 0%, 100% { transform: scaleX(1); opacity: .28; } 50% { transform: scaleX(.72); opacity: .14; } }
    @keyframes mc-fan { 0%, 100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); } 50% { transform: translate(calc(var(--dx) * 1.6), calc(var(--dy) * 1.2)) rotate(calc(var(--rot) * 1.5)); } }
    @keyframes mc-sweep { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { .mc-flip, .mc-bob, .mc-ghost, .mc-shadow, .mc-bar span { animation: none; } .mc-bar span { width: 100%; } }
  </style>
  <script>
    // Apply the saved theme before first paint so dark mode doesn't flash white
    try {
      var s = JSON.parse(localStorage.getItem("memcard_settings") || "{}");
      if (s.theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
    } catch (e) {}
  </script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root">
    <div class="mc-splash" role="status" aria-label="Đang tải MemCard">
      <div class="mc-stage">
        <span class="mc-ghost a"></span>
        <span class="mc-ghost b"></span>
        <div class="mc-bob">
          <div class="mc-flip">
            <div class="mc-face mc-front"><small>EN</small><strong>Hello</strong></div>
            <div class="mc-face mc-back"><small>VI</small><strong>Xin chào</strong></div>
          </div>
        </div>
        <span class="mc-shadow"></span>
      </div>
      <div class="mc-name">MemCard</div>
      <div class="mc-bar"><span></span></div>
    </div>
  </div>
